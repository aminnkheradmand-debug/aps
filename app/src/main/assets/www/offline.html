<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Offline</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#0C1017;color:#e9edf5;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center}
.box{padding:32px;max-width:420px}
h1{font-size:22px;margin:0 0 8px}
p{color:#9ca8bd;font-size:14px;line-height:1.8;margin:0 0 24px}
button{background:#10b981;color:#fff;border:none;border-radius:10px;padding:12px 28px;font-size:15px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="box">
<h1>You are offline</h1>
<p>This page needs an internet connection. Check your network and try again.</p>
<button onclick="location.reload()">Retry</button>
</div>
</body>
</html>
