<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>S Pen Test</title>
<style>
body { background: #0a0a0f; color: #0f0; font-family: monospace; padding: 20px; font-size: 16px; }
.dot { position: fixed; width: 40px; height: 40px; border-radius: 50%; background: red; pointer-events: none; transform: translate(-50%, -50%); opacity: 0.3; transition: opacity 0.15s; }
#log { margin-top: 20px; font-size: 12px; color: #fbbf24; line-height: 1.8; word-break: break-all; font-family: monospace; }
</style>
</head>
<body>
<h2>تست قلم S Pen</h2>
<div id="status">در انتظار رویداد…</div>
<div id="dot" class="dot"></div>
<div id="log"></div>
<script>
var count = 0;
var status = document.getElementById('status');
var dot = document.getElementById('dot');
var logEl = document.getElementById('log');

document.addEventListener('native-hover', function (ev) {
    count++;
    var d = ev.detail;
    status.textContent = 'native-hover #' + count + ' action=' + d.action;
    dot.style.left = d.x + 'px';
    dot.style.top = d.y + 'px';
    dot.style.opacity = 1;
    if (count < 5 || count % 20 === 0) {
        logEl.textContent =
            'x=' + d.x.toFixed(1) +
            ' y=' + d.y.toFixed(1) +
            ' pressure=' + d.pressure.toFixed(3) +
            ' tilt=' + d.tiltX.toFixed(2) +
            ' distance=' + d.distance.toFixed(2) +
            ' button=' + d.buttonState +
            ' tool=' + d.toolType;
    }
});

document.addEventListener('asp-pen-hover', function (ev) {
    var d = ev.detail;
    logEl.textContent += ' | asp-pen-hover x=' + d.x.toFixed(0) + ' y=' + d.y.toFixed(0);
});

document.addEventListener('pointermove', function (ev) {
    if (ev.pointerType === 'pen') {
        logEl.textContent += ' | POINTER pen';
    }
});

logEl.textContent = (window.ASPPen ? 'ASPPen v' + window.ASPPen.version : 'ASPPen missing') +
                    ' | __apsNativeHover: ' + (typeof window.__apsNativeHover);
</script>
</body>
</html>
