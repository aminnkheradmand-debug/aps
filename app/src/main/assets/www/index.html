<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دمو استایل‌های مدرن HTML — نسخه آفلاین ۲۰۲۶</title>
<style>
/* ============================================================
   1. RESET & BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Vazirmatn','Segoe UI',Tahoma,system-ui,-apple-system,sans-serif;
  background:#0a0a0f;color:#e8e8f0;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
ul{list-style:none}
code,pre{font-family:'Fira Code',Consolas,Monaco,monospace;direction:ltr;text-align:left}
::selection{background:rgba(99,102,241,.4)}

/* ============================================================
   2. APP SHELL
   ============================================================ */
.app-shell{
  display:grid;
  grid-template-columns:260px 1fr 340px;
  grid-template-rows:60px 1fr;
  height:100vh;
  overflow:hidden;
}
@media (max-width:1280px){
  .app-shell{grid-template-columns:240px 1fr 300px}
}
@media (max-width:1024px){
  .app-shell{grid-template-columns:1fr;grid-template-rows:60px auto 1fr auto;height:auto;min-height:100vh;overflow:auto}
}

/* Header */
.app-header{
  grid-column:1/-1;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;
  background:#0f0f18;
  border-bottom:1px solid #1e1e2a;
  position:sticky;top:0;z-index:100;
}
.app-title{
  display:flex;align-items:center;gap:12px;
  font-size:15px;font-weight:700;
}
.app-title .logo{
  width:32px;height:32px;border-radius:10px;
  background:linear-gradient(135deg,#6366f1,#a855f7);
  display:grid;place-items:center;font-size:16px;
}
.app-title .subtitle{
  font-size:11px;color:#7a7a90;font-weight:400;
}
.header-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fps-badge{
  display:flex;align-items:center;gap:6px;
  padding:5px 10px;background:#14141c;border:1px solid #25252f;
  border-radius:8px;font-size:12px;font-variant-numeric:tabular-nums;
}
.fps-dot{width:6px;height:6px;border-radius:50%;background:#22c55e;box-shadow:0 0 6px #22c55e}
.fps-dot.warn{background:#f59e0b;box-shadow:0 0 6px #f59e0b}
.fps-dot.bad{background:#ef4444;box-shadow:0 0 6px #ef4444}
.toggle-btn{
  display:flex;align-items:center;gap:6px;
  padding:6px 12px;background:#14141c;border:1px solid #25252f;
  border-radius:8px;font-size:12px;color:#a0a0b8;
  transition:all .2s;
}
.toggle-btn:hover{background:#1e1e2a;color:#e8e8f0}
.toggle-btn.active{
  background:rgba(99,102,241,.15);
  border-color:rgba(99,102,241,.5);
  color:#a5b4fc;
}
.toggle-btn .dot{
  width:8px;height:8px;border-radius:50%;background:#3a3a48;transition:all .2s;
}
.toggle-btn.active .dot{background:#6366f1;box-shadow:0 0 6px #6366f1}

/* Sidebar */
.sidebar{
  background:#0d0d14;
  border-left:1px solid #1e1e2a;
  padding:16px 12px;
  overflow-y:auto;
  height:100%;
}
@media (max-width:1024px){
  .sidebar{
    display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;
    padding:12px;border-left:none;border-bottom:1px solid #1e1e2a;
    height:auto;
  }
  .sidebar-title{display:none}
}
.sidebar-title{
  font-size:11px;color:#6a6a80;text-transform:uppercase;
  letter-spacing:.08em;margin-bottom:12px;padding-right:8px;
}
.style-list{display:flex;flex-direction:column;gap:2px}
@media (max-width:1024px){
  .style-list{flex-direction:row}
}
.style-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:10px;
  font-size:13px;color:#a0a0b8;text-align:right;
  transition:all .2s;cursor:pointer;
  white-space:nowrap;flex-shrink:0;
  border:1px solid transparent;
}
.style-item:hover{background:#14141c;color:#e8e8f0}
.style-item.active{
  background:rgba(99,102,241,.12);
  color:#c7d2fe;
  border-color:rgba(99,102,241,.3);
}
.style-item .icon{font-size:16px;flex-shrink:0}
.style-item .label{flex:1}
.style-item .perf-dot{
  width:6px;height:6px;border-radius:50%;flex-shrink:0;
}
.perf-dot.low{background:#22c55e}
.perf-dot.medium{background:#f59e0b}
.perf-dot.high{background:#ef4444}

/* Preview Pane */
.preview-pane{
  display:flex;flex-direction:column;
  overflow:hidden;
  background:#0a0a0f;
  min-height:0;
}
.preview-toolbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;
  background:#0d0d14;
  border-bottom:1px solid #1e1e2a;
  flex-wrap:wrap;gap:8px;
}
.preview-toolbar h2{font-size:14px;font-weight:600;color:#e8e8f0}
.preview-toolbar h2 .en{color:#7a7a90;font-weight:400;font-size:12px;margin-right:6px}
.preview-badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{
  padding:3px 8px;border-radius:6px;font-size:10px;font-weight:600;
  text-transform:uppercase;letter-spacing:.04em;
}
.badge.offline{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.3)}
.badge.low{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.3)}
.badge.medium{background:rgba(245,158,11,.15);color:#fbbf24;border:1px solid rgba(245,158,11,.3)}
.badge.high{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.3)}
.badge.chromium{background:rgba(99,102,241,.15);color:#a5b4fc;border:1px solid rgba(99,102,241,.3)}

.demo-canvas{
  flex:1;
  position:relative;
  overflow:auto;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  background:
    linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px) 0 0/40px 40px,
    linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px) 0 0/40px 40px,
    #0a0a0f;
  min-height:400px;
}
.demo-canvas > *{position:relative;z-index:1}

/* Info Pane */
.info-pane{
  background:#0d0d14;
  border-right:1px solid #1e1e2a;
  overflow-y:auto;
  padding:20px;
  height:100%;
}
@media (max-width:1024px){
  .info-pane{border-right:none;border-top:1px solid #1e1e2a;height:auto}
}
.info-pane::-webkit-scrollbar,.sidebar::-webkit-scrollbar,.demo-canvas::-webkit-scrollbar{width:6px;height:6px}
.info-pane::-webkit-scrollbar-thumb,.sidebar::-webkit-scrollbar-thumb,.demo-canvas::-webkit-scrollbar-thumb{
  background:#2a2a38;border-radius:3px;
}
.info-pane::-webkit-scrollbar-track,.sidebar::-webkit-scrollbar-track{background:transparent}

.info-header{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #1e1e2a}
.info-header h2{font-size:16px;font-weight:700;margin-bottom:4px}
.info-header .en{font-size:12px;color:#7a7a90;font-weight:400}
.info-header .tagline{
  margin-top:10px;font-size:12.5px;color:#a0a0b8;line-height:1.7;
}

.info-section{margin-bottom:18px}
.info-section h3{
  font-size:12px;color:#6a6a80;text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:10px;font-weight:600;
}
.info-section ul{display:flex;flex-direction:column;gap:8px}
.info-section li{
  display:flex;gap:8px;font-size:12.5px;color:#c0c0d0;line-height:1.6;
}
.info-section li::before{
  content:'◆';color:#6366f1;font-size:8px;flex-shrink:0;margin-top:6px;
}

.info-meta{
  display:grid;grid-template-columns:1fr;gap:10px;
  padding:14px;background:#14141c;border-radius:12px;
  border:1px solid #1e1e2a;margin-bottom:18px;
}
.meta-item{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.meta-label{color:#7a7a90}
.meta-value{
  padding:2px 8px;border-radius:6px;font-weight:600;font-size:11px;
}
.meta-value.low{background:rgba(34,197,94,.15);color:#4ade80}
.meta-value.medium{background:rgba(245,158,11,.15);color:#fbbf24}
.meta-value.high{background:rgba(239,68,68,.15);color:#f87171}
.meta-value.info{background:rgba(99,102,241,.15);color:#a5b4fc}
.meta-value.warn{background:rgba(245,158,11,.15);color:#fbbf24}

.info-notes{
  padding:14px;background:rgba(245,158,11,.06);
  border:1px solid rgba(245,158,11,.2);
  border-radius:12px;font-size:12.5px;color:#d0c0a0;line-height:1.7;
  margin-bottom:18px;
}
.info-notes strong{color:#fbbf24;display:block;margin-bottom:6px;font-size:12px}

.info-code{margin-bottom:18px}
.info-code summary{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;background:#14141c;
  border:1px solid #1e1e2a;border-radius:10px;
  cursor:pointer;font-size:12px;color:#a0a0b8;
  list-style:none;transition:all .2s;
}
.info-code summary::-webkit-details-marker{display:none}
.info-code summary:hover{background:#1a1a24;color:#e8e8f0}
.info-code summary::after{content:'▾';transition:transform .2s}
.info-code[open] summary::after{transform:rotate(180deg)}
.info-code[open] summary{border-radius:10px 10px 0 0;border-bottom:none}
.code-wrap{
  position:relative;
  background:#08080c;border:1px solid #1e1e2a;
  border-radius:0 0 10px 10px;overflow:hidden;
}
.code-wrap pre{
  padding:14px;font-size:11px;color:#c0c0d0;
  overflow-x:auto;max-height:320px;overflow-y:auto;
  line-height:1.6;
}
.code-wrap pre::-webkit-scrollbar{width:5px;height:5px}
.code-wrap pre::-webkit-scrollbar-thumb{background:#2a2a38;border-radius:3px}
.copy-btn{
  position:absolute;top:8px;left:8px;
  padding:4px 10px;background:#1e1e2a;
  border:1px solid #2a2a38;border-radius:6px;
  font-size:10px;color:#a0a0b8;transition:all .2s;
}
.copy-btn:hover{background:#25252f;color:#e8e8f0}
.copy-btn.copied{background:rgba(34,197,94,.2);color:#4ade80;border-color:rgba(34,197,94,.4)}

/* ============================================================
   3. SHARED GLASS TOKENS (used by multiple demos)
   ============================================================ */
.demo-canvas{
  --glass-bg: rgba(255,255,255,.14);
  --glass-border: rgba(255,255,255,.28);
  --glass-shadow: 0 8px 32px rgba(0,0,0,.25);
  --glass-blur: 18px;
  --radius: 24px;
}

.glass-card{
  position:relative;
  background:var(--glass-bg);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(180%);
  backdrop-filter:blur(var(--glass-blur)) saturate(180%);
  border:1px solid var(--glass-border);
  border-radius:var(--radius);
  box-shadow:var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,.35);
  padding:20px 24px;
  color:#fff;
}
.glass-card h3{font-size:15px;font-weight:600;margin-bottom:6px}
.glass-card p{font-size:12.5px;color:rgba(255,255,255,.8);line-height:1.7}

/* Rich backgrounds for glass demos */
.rich-bg{
  position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(60vmax 60vmax at 15% 20%,#7c5cff 0,transparent 60%),
    radial-gradient(50vmax 50vmax at 85% 30%,#00d4ff 0,transparent 55%),
    radial-gradient(60vmax 60vmax at 50% 95%,#ff5fa2 0,transparent 60%),
    #0b0b16;
}

/* Reduced-motion & reduced-transparency overrides */
.reduce-motion .demo-canvas *{
  animation-duration:0.001ms !important;
  animation-iteration-count:1 !important;
  transition-duration:0.001ms !important;
}
.reduce-motion .demo-canvas .aurora-blob,
.reduce-motion .demo-canvas .water-caustic,
.reduce-motion .demo-canvas .ai-streaming{animation:none !important}

.reduce-transparency .demo-canvas .glass-card,
.reduce-transparency .demo-canvas .liquid-glass-demo,
.reduce-transparency .demo-canvas .water-glass-demo,
.reduce-transparency .demo-canvas .reading-zone{
  background:rgba(20,20,24,.95) !important;
  -webkit-backdrop-filter:none !important;
  backdrop-filter:none !important;
  border-color:rgba(255,255,255,.08) !important;
}

@media (prefers-reduced-motion:reduce){
  .demo-canvas *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}

/* ============================================================
   4. STYLE 1 — FROSTED GLASS
   ============================================================ */
.demo-frosted{position:relative;width:100%;height:100%;min-height:400px;display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;padding:24px;overflow:hidden;border-radius:16px}
.demo-frosted .glass-card{width:240px}
.demo-frosted .near{--glass-blur:28px;--glass-bg:rgba(255,255,255,.20)}
.demo-frosted .badge-pill{
  padding:6px 14px;border-radius:99px;font-size:11px;font-weight:600;
  background:rgba(255,255,255,.14);backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.28);color:#fff;
  position:absolute;top:16px;left:16px;
}

/* ============================================================
   5. STYLE 2 — LIQUID GLASS
   ============================================================ */
.demo-liquid{position:relative;width:100%;min-height:420px;padding:24px;overflow:hidden;border-radius:16px;display:flex;flex-direction:column;gap:16px}
.demo-liquid .tier-tabs{display:flex;gap:6px;z-index:2;justify-content:center;flex-wrap:wrap}
.demo-liquid .tier-tab{
  padding:6px 14px;border-radius:99px;font-size:11px;font-weight:600;
  background:rgba(0,0,0,.4);color:#a0a0b8;border:1px solid #2a2a38;
  transition:all .2s;
}
.demo-liquid .tier-tab.active{background:rgba(99,102,241,.3);color:#c7d2fe;border-color:rgba(99,102,241,.6)}
.demo-liquid .tier-tab:hover{color:#e8e8f0}

.liquid-stage{
  flex:1;display:flex;align-items:center;justify-content:center;
  position:relative;min-height:280px;z-index:1;
}
.liquid-glass-demo{
  position:relative;width:280px;height:170px;border-radius:28px;overflow:hidden;
  isolation:isolate;
  box-shadow:0 10px 40px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;
  transition:transform .35s cubic-bezier(.34,1.56,.64,1);
}
.liquid-glass-demo:active{transform:scale(.96)}
.liquid-glass-demo > .layer{position:absolute;inset:0;border-radius:inherit;pointer-events:none}

/* Tier 0: pure CSS */
.liquid-glass-demo[data-tier="0"] .warp{
  backdrop-filter:blur(14px) saturate(180%) brightness(1.08);
  -webkit-backdrop-filter:blur(14px) saturate(180%) brightness(1.08);
}
.liquid-glass-demo[data-tier="0"] .tint{background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.05))}
.liquid-glass-demo[data-tier="0"] .spec{
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.7),
    inset 0 -1px 1px rgba(255,255,255,.15),
    inset 0 0 18px rgba(255,255,255,.12);
}
.liquid-glass-demo[data-tier="0"] .pointer-spec{
  background:radial-gradient(160px circle at var(--mx,50%) var(--my,0%),
              rgba(255,255,255,.35), transparent 60%);
}

/* Tier A: CSS + specular */
.liquid-glass-demo[data-tier="A"] .warp{
  backdrop-filter:blur(10px) saturate(170%) brightness(1.08);
  -webkit-backdrop-filter:blur(10px) saturate(170%) brightness(1.08);
}
.liquid-glass-demo[data-tier="A"] .tint{background:rgba(255,255,255,.10)}
.liquid-glass-demo[data-tier="A"] .spec{
  box-shadow:
    inset 1px 1px 0 rgba(255,255,255,.55),
    inset -1px -1px 0 rgba(255,255,255,.15),
    inset 0 0 22px rgba(255,255,255,.12);
  background:linear-gradient(135deg,rgba(255,255,255,.35),transparent 35%,transparent 65%,rgba(255,255,255,.12));
}

/* Tier B: SVG displacement */
.liquid-glass-demo[data-tier="B"] .warp{
  backdrop-filter:url(#lgDisplace) blur(4px) saturate(170%);
  -webkit-backdrop-filter:url(#lgDisplace) blur(4px) saturate(170%);
  background:rgba(255,255,255,.06);
}
.liquid-glass-demo[data-tier="B"] .tint{background:rgba(255,255,255,.05)}
.liquid-glass-demo[data-tier="B"] .spec{
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.35), inset 0 0 30px rgba(255,255,255,.15);
}

.liquid-content{
  position:relative;z-index:3;text-align:center;color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.4);padding:16px;
}
.liquid-content h3{font-size:18px;font-weight:700;margin-bottom:4px}
.liquid-content p{font-size:11.5px;opacity:.85;letter-spacing:.03em}
.demo-liquid .support-note{
  text-align:center;font-size:11px;color:#7a7a90;z-index:2;
  background:rgba(0,0,0,.4);padding:6px 12px;border-radius:8px;align-self:center;
}

/* ============================================================
   6. STYLE 3 — WATER GLASS
   ============================================================ */
.demo-water{position:relative;width:100%;min-height:420px;padding:24px;overflow:hidden;border-radius:16px;display:flex;align-items:center;justify-content:center}
.water-glass-demo{
  position:relative;padding:28px 36px;border-radius:32px;color:#fff;
  overflow:hidden;max-width:320px;
  background:linear-gradient(160deg,rgba(120,220,255,.28),rgba(40,120,220,.18) 60%,rgba(0,60,140,.22));
  backdrop-filter:blur(18px) saturate(190%) hue-rotate(-8deg);
  -webkit-backdrop-filter:blur(18px) saturate(190%) hue-rotate(-8deg);
  border:1px solid rgba(190,240,255,.5);
  box-shadow:
    0 14px 40px rgba(0,80,160,.35),
    inset 0 2px 0 rgba(255,255,255,.7),
    inset 0 -14px 28px rgba(0,200,255,.25);
}
.water-glass-demo::before{
  content:"";position:absolute;left:8%;right:8%;top:4px;height:38%;
  border-radius:50%/100% 100% 0 0;
  background:linear-gradient(to bottom,rgba(255,255,255,.55),transparent);
  filter:blur(1px);pointer-events:none;
}
.water-glass-demo::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120px 60px at 30% 100%,rgba(140,255,255,.35),transparent 70%);
  animation:caustic 6s ease-in-out infinite alternate;
}
@keyframes caustic{to{transform:translateX(35%)}}
.water-glass-demo h3{font-size:20px;margin-bottom:6px}
.water-glass-demo p{font-size:12.5px;opacity:.9}

/* ============================================================
   7. STYLE 4 — BENTO GRID
   ============================================================ */
.demo-bento{position:relative;width:100%;min-height:440px;padding:20px;overflow:hidden;border-radius:16px}
.bento-grid{
  display:grid;gap:12px;width:100%;height:100%;
  grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(3,minmax(100px,1fr));
  grid-template-areas:
    "hero hero a b"
    "hero hero c c"
    "d e c c";
}
.bento-tile{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.16);
  border-radius:20px;
  -webkit-backdrop-filter:blur(16px);
  backdrop-filter:blur(16px);
  padding:16px;color:#fff;
  display:flex;flex-direction:column;justify-content:space-between;
  transition:transform .25s cubic-bezier(.2,.8,.2,1);
  position:relative;overflow:hidden;
}
.bento-tile:active{transform:scale(.98)}
.bento-tile .label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.6)}
.bento-tile .value{font-size:22px;font-weight:700}
.bento-tile .desc{font-size:12px;color:rgba(255,255,255,.75);line-height:1.5}
.bento-tile.hero{grid-area:hero;background:linear-gradient(135deg,rgba(99,102,241,.3),rgba(168,85,247,.2))}
.bento-tile.a{grid-area:a}
.bento-tile.b{grid-area:b}
.bento-tile.c{grid-area:c;background:linear-gradient(135deg,rgba(34,211,238,.2),rgba(59,130,246,.15))}
.bento-tile.d{grid-area:d}
.bento-tile.e{grid-area:e;background:linear-gradient(135deg,rgba(251,146,60,.2),rgba(239,68,68,.15))}
@media (max-width:600px){
  .bento-grid{
    grid-template-columns:1fr 1fr;
    grid-template-rows:auto;
    grid-template-areas:
      "hero hero"
      "a b"
      "c c"
      "d e";
  }
}

/* ============================================================
   8. STYLE 5 — AURORA
   ============================================================ */
.demo-aurora{position:relative;width:100%;min-height:420px;overflow:hidden;border-radius:16px;display:flex;align-items:center;justify-content:center;padding:24px}
.aurora-bg{position:absolute;inset:0;z-index:0;background:#07070f;overflow:hidden}
.aurora-blob{
  position:absolute;width:55vmax;height:55vmax;border-radius:50%;
  filter:blur(70px);opacity:.7;
  animation:float 18s ease-in-out infinite alternate;
}
.aurora-blob:nth-child(1){background:#6d5dfc;left:-20%;top:-15%}
.aurora-blob:nth-child(2){background:#00e0ff;right:-20%;top:5%;animation-duration:24s}

}

  box-shadow:inset 6px 6px 12px #a3b1c6,inset -6px -6px 12px #fff;
}

  width:180px;height:12px;background:#e0e5ec;border-radius:6px;
  box-shadow:inset 3px 3px 6px #a3b1c6,inset -3px -3px 6px #fff;
  position:relative;
}
.neu-slider::after{
  content:"";position:absolute;top:-6px;right:60%;
  width:24px;height:24px;border-radius:50%;background:#6366f1;
  box-shadow:2px 2px 4px #a3b1c6;
}
.neu-label{font-size:11px;color:#5a6478;text-align:center}

/* ============================================================
   10. STYLE 7 — NEO-BRUTALISM
   ============================================================ */
.demo-neo{position:relative;width:100%;min-height:420px;padding:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;border-radius:16px;background:#f4f4f0;flex-wrap:wrap}
.neo-card{
  background:#ffde59;border:3px solid #000;border-radius:0;

}
.neo-card:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 #000}
.neo-card h3{font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;margin-bottom:6px}
.neo-card p{font-size:12px;line-height:1.6;color:#333}
.neo-btn{
  background:#ff90e8;border:3px solid #000;border-radius:0;
  box-shadow:4px 4px 0 #000;padding:10px 22px;
  font-size:12px;font-weight:800;text-transform:uppercase;
  letter-spacing:.04em;transition:transform 100ms ease,box-shadow 100ms ease;
}
.neo-btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #000}
.neo-btn:active{transform:translate(4px,4px);box-shadow:0 0 0 #000}

/* ============================================================
   11. STYLE 8 — DARK GLASS / OLED
   ============================================================ */
.demo-oled{position:relative;width:100%;min-height:420px;padding:32px;border-radius:16px;background:#050505;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;color:#f5f0e8}

  background:#0f0f0f;border:1px solid rgba(200,164,92,.22);

}

}

  background:rgba(14,14,24,.88);

}

/* ============================================================
   12. STYLE 9 — EXPRESSIVE MINIMALISM
   ============================================================ */
.demo-expressive{position:relative;width:100%;min-height:420px;padding:40px;border-radius:16px;background:#faf9f7;color:#111;display:flex;flex-direction:column;justify-content:center;gap:24px}
.expressive-nav{display:flex;gap:2rem;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:#555}

}

/* ============================================================
   13. STYLE 10 — SPATIAL DEPTH
   ============================================================ */
.demo-spatial{position:relative;width:100%;min-height:420px;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#1a1a2e,#16213e);display:flex;align-items:center;justify-content:center;perspective:1000px}

  width:70%;height:60%;background:linear-gradient(135deg,#6366f1,#a855f7);

}

  width:50%;height:45%;background:linear-gradient(135deg,#22d3ee,#3b82f6);

  font-size:16px;font-weight:700;color:#fff;
}
.spatial-fg{
  width:280px;height:160px;background:rgba(255,255,255,.15);

/* ============================================================

.demo-clay{position:relative;width:100%;min-height:420px;padding:32px;border-radius:16px;background:linear-gradient(135deg,#f0e0f0,#e0d0f0);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.clay-card{
  background:#e8d8f0;border-radius:32px;padding:28px 36px;max-width:280px;

    8px 8px 24px rgba(80,50,120,.25),

  text-align:center;color:#4a2d6b;
}
.clay-card h3{font-size:15px;font-weight:700;margin-bottom:8px}
.clay-card p{font-size:12px;line-height:1.7;opacity:.8}
.clay-btn{
  background:#ffb3d9;border-radius:20px;padding:12px 28px;
  font-size:13px;font-weight:700;color:#5a2d4a;

}

}

/* ============================================================
   15. STYLE 12 — DARK MODE / ADAPTIVE
   ============================================================ */
.demo-darkmode{position:relative;width:100%;min-height:420px;border-radius:16px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr}
.dm-half{padding:24px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.dm-half.light{background:#faf9f7;color:#111}
.dm-half.dark{background:#0a0a0f;color:#f5f5f7}
.dm-half h3{font-size:14px;font-weight:700;margin-bottom:4px}
.dm-half .tag{font-size:10px;text-transform:uppercase;letter-spacing:.1em;opacity:.6}
.dm-card{border-radius:12px;padding:14px;font-size:12px;line-height:1.6}

.dm-half.dark .dm-card{background:#14141c;border:1px solid #25252f;color:#c0c0d0}
.dm-accent{padding:8px 16px;border-radius:8px;font-size:11px;font-weight:700;text-align:center;width:fit-content}
.dm-half.light .dm-accent{background:#6366f1;color:#fff}
.dm-half.dark .dm-accent{background:#a5b4fc;color:#0a0a0f}

/* ============================================================
   16. STYLE 13 — BETWEEN GLASS & WATER (combined)
   ============================================================ */
.demo-combo{position:relative;width:100%;min-height:440px;padding:24px;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.combo-card{
  position:relative;width:300px;height:180px;border-radius:32px;overflow:hidden;
  isolation:isolate;
  background:linear-gradient(160deg,rgba(120,220,255,.22),rgba(40,120,220,.14) 60%,rgba(0,60,140,.20));
  -webkit-backdrop-filter:blur(20px) saturate(190%) hue-rotate(-8deg);
  backdrop-filter:blur(20px) saturate(190%) hue-rotate(-8deg);
  border:1px solid rgba(190,240,255,.45);
  box-shadow:
    0 16px 50px rgba(0,80,160,.4),
    inset 0 2px 0 rgba(255,255,255,.65),
    inset 0 -16px 32px rgba(0,200,255,.22);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;text-align:center;padding:20px;gap:6px;
}
.combo-card::before{
  content:"";position:absolute;left:8%;right:8%;top:4px;height:36%;
  border-radius:50%/100% 100% 0 0;
  background:linear-gradient(to bottom,rgba(255,255,255,.55),transparent);
  filter:blur(1px);pointer-events:none;
}
.combo-card::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120px 60px at 30% 100%,rgba(140,255,255,.35),transparent 70%);
  animation:caustic 6s ease-in-out infinite alternate;
}
.combo-card h3{font-size:18px;font-weight:700;text-shadow:0 2px 6px rgba(0,40,80,.4);position:relative;z-index:1}

.combo-note{font-size:11px;color:#7a7a90;text-align:center;max-width:400px}

/* Utility */
.hidden{display:none !important}
</style>

<body>

<!-- SVG filter defs for Liquid Glass Tier B & Water Glass -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

<script>
/* ============================================================
   STYLES DATA
   ============================================================ */
const STYLES = {
  'frosted-glass': {
    icon: '🪟',
    title: 'شیشه مات',
    en: 'Frosted Glass / Classic Glassmorphism',
    tagline: 'سطح نیمه‌شفاف با بلور پس‌زمینه، حاشیه ۱px روشن، و سایه نرم. نسخه ۲۰۲۶ آرام‌تر است و از لایه noise و حاشیه گرادیانی استفاده می‌کند.',
    features: [
      '۴ جزء اصلی: پس‌زمینه بلور، پرکننده ۱۰ تا ۳۰٪، حاشیه ۱px روشن، و پس‌زمینه جذاب',
      'لایه noise اختیاری برای کاهش «حس پلاستیکی»',
      'مناسب: هدر چسبان، کارت‌های کوتاه، نوار پایین',
      'نامناسب برای متن‌های طولانی (خوانایی کاهش می‌یابد)'
    ],
    support: 'همه مرورگرهای مدرن (Safari 9+، Firefox 103+)',
    webview: 'امن‌ترین سبک شیشه. در Android WebView (Chromium) کار می‌کند',
    a11y: 'متن روی شیشه باید کوتاه باشد. برای متن طولانی از scrim (پوشش تیره) استفاده کنید',
    risk: 'medium',
    perf: 'medium',
    code: [
      '.glass-card {',
      '  background: rgba(255,255,255,.14);',
      '  -webkit-backdrop-filter: blur(18px) saturate(180%);',
      '  backdrop-filter: blur(18px) saturate(180%);',
      '  border: 1px solid rgba(255,255,255,.28);',
      '  border-radius: 24px;',
      '  box-shadow: 0 8px 32px rgba(0,0,0,.25),',
      '              inset 0 1px 0 rgba(255,255,255,.35);',
      '}',
      '@supports not (backdrop-filter: blur(1px)) {',
      '  .glass-card { background: rgba(30,30,45,.9); }',
      '}'
    ].join('\n'),
    render() {
      return `
        <div class="demo-frosted">
          <div class="rich-bg"></div>
          <div class="badge-pill">LIVE BLUR</div>
          <div class="glass-card">
            <h3>کارت شیشه‌ای</h3>
            <p>این یک کارت شیشه مات با بلور پس‌زمینه است. حاشیه روشن بالایی، عمق را حس می‌کند.</p>
          </div>
          <div class="glass-card near">
            <h3>کارت نزدیک‌تر</h3>
            <p>blur بیشتر و پرکننده قوی‌تر = لایه‌ای نزدیک‌تر به کاربر.</p>
          </div>
        </div>`;
    }
  },

  'liquid-glass': {
    icon: '💧',
    title: 'شیشه مایع',
    en: 'Liquid Glass (iOS 26 Approximation)',
    tagline: 'تقریب CSS/SVG از افکت شیشه مایع اپل iOS 26. سه لایه: بلور پس‌زمینه، اعوجاج SVG، و بازتاب specular. Tier 0 و A در همه‌جا، Tier B فقط Chromium.',
    features: [
      'Tier 0: شیشه مات ساده + specular تعاملی با pointer',
      'Tier A: شیشه با بازتاب داخلی و هایلایت دقیق‌تر',
      'Tier B: اعوجاج واقعی با feDisplacementMap (فقط Chromium)',
      'fallback خودکار برای Safari و Firefox'
    ],
    support: 'Tier 0/A: همه مرورگرها • Tier B: فقط Chromium',
    webview: 'Android WebView چون Chromium است Tier B را پشتیبانی می‌کند، اما باید روی دستگاه واقعی تست شود',
    a11y: 'هیچ‌وقت به backdrop-filter برای خوانایی تکیه نکنید؛ همیشه fallback سالید داشته باشید',
    risk: 'high',
    perf: 'high',
    code: [
      '/* Tier 0 - امن برای همه */',
      '.liquid {',
      '  background: linear-gradient(135deg,',
      '    rgba(255,255,255,.22), rgba(255,255,255,.05));',
      '  backdrop-filter: blur(14px) saturate(180%) brightness(1.08);',
      '  box-shadow: inset 0 1px 1px rgba(255,255,255,.7),',
      '              inset 0 0 18px rgba(255,255,255,.12);',
      '}',
      '',
      '/* Tier B - فقط Chromium */',
      '.liquid-refract {',
      '  backdrop-filter: url(#lgDisplace) blur(4px) saturate(170%);',
      '}',
      '@supports not (backdrop-filter: url(#lgDisplace)) {',
      '  .liquid-refract { backdrop-filter: blur(14px) saturate(180%); }',
      '}'
    ].join('\n'),
    init(container) {
      // Pointer-following specular for Tier 0
      container.querySelectorAll('.liquid-glass-demo').forEach(el => {
        el.addEventListener('pointermove', e => {
          const r = el.getBoundingClientRect();
          el.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%');
          el.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100) + '%');
        });
      });
      // Tier tab switching
      container.querySelectorAll('.tier-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          container.querySelectorAll('.tier-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          const tier = tab.dataset.tier;
          const card = container.querySelector('.liquid-glass-demo');
          card.dataset.tier = tier;
          const note = container.querySelector('.support-note');
          if (tier === 'B') {
            const isChrome = !!window.chrome && /Chrome\//.test(navigator.userAgent);
            note.textContent = isChrome
              ? '✓ Tier B فعال — Chromium شناسایی شد'
              : '⚠ Tier B در این مرورگر رندر نمی‌شود — fallback فعال است';
            note.style.color = isChrome ? '#4ade80' : '#fbbf24';
          } else {
            note.textContent = tier === '0' ? 'Tier 0: CSS خالص — امن برای همه' : 'Tier A: CSS + specular — امن برای همه';
            note.style.color = '#7a7a90';
          }
        });
      });
    },
    render() {
      return `
        <div class="demo-liquid">
          <div class="rich-bg"></div>
          <div class="tier-tabs">
            <button class="tier-tab active" data-tier="0">Tier 0</button>
            <button class="tier-tab" data-tier="A">Tier A</button>
            <button class="tier-tab" data-tier="B">Tier B (Chromium)</button>
          </div>
          <div class="liquid-stage">
            <div class="liquid-glass-demo" data-tier="0">
              <div class="layer warp"></div>
              <div class="layer tint"></div>
              <div class="layer spec"></div>
              <div class="layer pointer-spec"></div>
              <div class="liquid-content">
                <h3>Liquid Glass</h3>
                <p>Pointer را حرکت دهید</p>
              </div>
            </div>

    code: [
      '.scene {',
      '  perspective: 1000px;',
      '  overflow: hidden;',
      '}',
      '.layer { transform-style: preserve-3d; }',
      '.layer-bg {',
      '  transform: translateZ(-200px) scale(1.4);',
      '}',
      '.layer-mid {',
      '  transform: translateZ(-80px) scale(1.15);',
      '}',
      '.layer-fg {',
      '  transform: translateZ(40px);',
      '}',
      '@media (prefers-reduced-motion: reduce) {',
      '  .layer { transform: none !important; }',
      '}'
    ].join('\n'),
    init(container) {
      const scene = container.querySelector('.spatial-scene');
      const bg = container.querySelector('.spatial-bg');
      const mid = container.querySelector('.spatial-mid');
      const fg = container.querySelector('.spatial-fg');
      scene.addEventListener('pointermove', e => {
        const r = scene.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width - 0.5;
        const y = (e.clientY - r.top) / r.height - 0.5;
        bg.style.transform = `translateZ(-200px) scale(1.4) translate(${x*8}px, ${y*8}px)`;
        mid.style.transform = `translateZ(-80px) scale(1.15) translate(${x*5}px, ${y*5}px)`;
        fg.style.transform = `translateZ(40px) translate(${x*-8}px, ${y*-8}px)`;
      });
      scene.addEventListener('pointerleave', () => {
        bg.style.transform = 'translateZ(-200px) scale(1.4)';
        mid.style.transform = 'translateZ(-80px) scale(1.15)';
        fg.style.transform = 'translateZ(40px)';
      });
    },
    render() {
      return `
        <div class="demo-spatial">
          <div class="spatial-scene">
            <div class="spatial-layer spatial-bg">BACKGROUND</div>
            <div class="spatial-layer spatial-mid">MIDDLE</div>
            <div class="spatial-layer spatial-fg">

    webview: 'بدون ریسک',
    a11y: 'در حالت dark از مشکی خالص برای halation استفاده نکنید',
    risk: 'low',

    code: [

    ].join('\n'),
    render() {

    ],

/* ============================================================
   RENDER LOGIC
   ============================================================ */
const styleListEl = document.getElementById('styleList');
const demoCanvas = document.getElementById('demoCanvas');
const previewTitle = document.getElementById('previewTitle');
const previewBadges = document.getElementById('previewBadges');
const infoPane = document.getElementById('infoPane');

let currentStyle = null;

function buildSidebar() {
  styleListEl.innerHTML = Object.entries(STYLES).map(([id, s]) => `
    <li class="style-item" data-style="${id}">
      <span class="icon">${s.icon}</span>
      <span class="label">${s.title}</span>
      <span class="perf-dot ${s.perf}"></span>
    </li>
  `).join('');
  styleListEl.querySelectorAll('.style-item').forEach(item => {
    item.addEventListener('click', () => selectStyle(item.dataset.style));
  });
}

function selectStyle(id) {
  if (!STYLES[id]) id = 'frosted-glass';
  currentStyle = id;

  // Sidebar active state
  styleListEl.querySelectorAll('.style-item').forEach(el => {
    el.classList.toggle('active', el.dataset.style === id);
  });

  const style = STYLES[id];

  // Toolbar
  previewTitle.innerHTML = `${style.title} <span class="en">${style.en}</span>`;
  previewBadges.innerHTML = `
    <span class="badge offline">Offline</span>
    <span class="badge ${style.perf}">GPU: ${{low:'کم',medium:'متوسط',high:'بالا'}[style.perf]}</span>
    <span class="badge ${style.risk}">WebView: ${{low:'کم',medium:'متوسط',high:'بالا'}[style.risk]}</span>
    ${id === 'liquid-glass' || id === 'water-glass' || id === 'combo'
      ? '<span class="badge chromium">Chromium Tier B</span>' : ''}
  `;

  // Demo
  demoCanvas.innerHTML = style.render();
  if (typeof style.init === 'function') {
    try { style.init(demoCanvas); } catch (e) { console.warn('init failed', e); }
  }

  // Info pane
  renderInfo(style, id);

  // Update hash
  history.replaceState(null, '', '#' + id);

  // Scroll canvas to top
  demoCanvas.scrollTop = 0;
}

function renderInfo(style, id) {
  const perfLabel = {low:'کم',medium:'متوسط',high:'بالا'}[style.perf];
  const riskLabel = {low:'کم',medium:'متوسط',high:'بالا'}[style.risk];

  infoPane.innerHTML = `
    <div class="info-header">
      <h2>${style.icon} ${style.title}</h2>
      <div class="en">${style.en}</div>
      <p class="tagline">${style.tagline}</p>
    </div>

    <div class="info-section">
      <h3>✨ ویژگی‌ها</h3>
      <ul>${style.features.map(f => `<li>${f}</li>`).join('')}</ul>
    </div>

    <div class="info-meta">
      <div class="meta-item">
        <span class="meta-label">پشتیبانی مرورگر</span>
        <span class="meta-value info">${style.support}</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">ریسک WebView</span>
        <span class="meta-value ${style.risk}">${riskLabel}</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">هزینه GPU</span>
        <span class="meta-value ${style.perf}">${perfLabel}</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">شبکه</span>
        <span class="meta-value low">آفلاین</span>
      </div>
    </div>

    <div class="info-notes">
      <strong>🌐 نکته WebView</strong>
      ${style.webview}
    </div>

    <div class="info-notes">
      <strong>♿ دسترس‌پذیری</strong>
      ${style.a11y}
    </div>

    <details class="info-code">
      <summary>📝 کد آماده کپی</summary>
      <div class="code-wrap">
        <button class="copy-btn" data-code-id="${id}">کپی</button>
        <pre><code>${escapeHtml(style.code)}</code></pre>
      </div>
    </details>

    <div style="font-size:11px;color:#6a6a80;line-height:1.8;padding-top:8px;border-top:1px solid #1e1e2a">
      <strong style="color:#a0a0b8">یادآوری:</strong>
      این سبک نیاز به شبکه ندارد. همه فونت‌ها، تصاویر و فیلترها محلی هستند.
      قبل از انتشار روی دستگاه واقعی تست کنید.
    </div>
  `;

  // Copy button
  const copyBtn = infoPane.querySelector('.copy-btn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const codeEl = infoPane.querySelector('pre code');
      try {
        await navigator.clipboard.writeText(codeEl.textContent);
        copyBtn.textContent = '✓ کپی شد';
        copyBtn.classList.add('copied');
        setTimeout(() => {
          copyBtn.textContent = 'کپی';
          copyBtn.classList.remove('copied');
        }, 1800);
      } catch {
        copyBtn.textContent = 'خطا';
        setTimeout(() => copyBtn.textContent = 'کپی', 1500);
      }
    });
  }
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ============================================================
   FPS COUNTER
   ============================================================ */
let frames = 0;
let lastTick = performance.now();
const fpsValue = document.getElementById('fpsValue');
const fpsDot = document.getElementById('fpsDot');

function tick(now) {
  frames++;
  if (now - lastTick >= 1000) {
    const fps = Math.round(frames * 1000 / (now - lastTick));
    fpsValue.textContent = fps;
    fpsDot.className = 'fps-dot' + (fps >= 50 ? '' : fps >= 30 ? ' warn' : ' bad');
    frames = 0;
    lastTick = now;
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ============================================================
   TOGGLES (motion & transparency simulation)
   ============================================================ */
const btnMotion = document.getElementById('btnMotion');
const btnTransparency = document.getElementById('btnTransparency');

btnMotion.addEventListener('click', () => {
  document.body.classList.toggle('reduce-motion');
  btnMotion.classList.toggle('active');
  btnMotion.querySelector('.dot').style.background =
    btnMotion.classList.contains('active') ? '#6366f1' : '#3a3a48';
});

btnTransparency.addEventListener('click', () => {
  document.body.classList.toggle('reduce-transparency');
  btnTransparency.classList.toggle('active');
  btnTransparency.querySelector('.dot').style.background =
    btnTransparency.classList.contains('active') ? '#6366f1' : '#3a3a48';
});

/* ============================================================
   INIT
   ============================================================ */
buildSidebar();

// Read hash or fallback
const hash = location.hash.replace('#', '');
selectStyle(STYLES[hash] ? hash : 'frosted-glass');

window.addEventListener('hashchange', () => {
  const h = location.hash.replace('#', '');
  if (STYLES[h]) selectStyle(h);
});
</script>
